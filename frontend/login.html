<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用户登录 · 田园优选 | 张婧雅 24005240115</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <canvas class="zhang_canvas_bg" id="zhang_canvas_bg"></canvas>

  <header class="zhang_top">
    <div class="zhang_top_inner">
      <div class="zhang_brand">
        <span class="zhang_brand_mark">田</span>
        <div class="zhang_brand_text">
          <div class="zhang_brand_name">田园优选</div>
          <div class="zhang_brand_desc">用户登录</div>
        </div>
      </div>
      <nav class="zhang_top_nav">
        <a href="./index.html">返回首页</a>
        <a href="./register.html">注册账号</a>
      </nav>
    </div>
  </header>

  <main class="zhang_wrap zhang_wrap_auth">
    <section class="zhang_section">
      <h2 class="zhang_section_title">用户登录</h2>
      <div class="zhang_panel zhang_auth_panel">
        <!-- 未登录：登录表单 -->
        <div id="zhang_login_area">
          <p class="zhang_auth_sub">登录成功后令牌保存在浏览器本地，刷新或关闭页面再打开仍保持登录状态（有效期 2 小时）。</p>
          <form class="zhang_form" id="zhang_login_form" novalidate>
            <div class="zhang_form_item">
              <label class="zhang_form_label" for="zhang_login_username">用户名</label>
              <input class="zhang_input" id="zhang_login_username" type="text" placeholder="请输入用户名" autocomplete="username" maxlength="20" />
              <p class="zhang_form_tip" id="zhang_login_username_tip"></p>
            </div>
            <div class="zhang_form_item">
              <label class="zhang_form_label" for="zhang_login_password">密码</label>
              <input class="zhang_input" id="zhang_login_password" type="password" placeholder="请输入密码" autocomplete="current-password" maxlength="20" />
              <p class="zhang_form_tip" id="zhang_login_password_tip"></p>
            </div>
            <div class="zhang_form_item">
              <label class="zhang_form_label" for="zhang_login_captcha">图形验证码</label>
              <div class="zhang_captcha_row">
                <input class="zhang_input" id="zhang_login_captcha" type="text" placeholder="4 位验证码" autocomplete="off" maxlength="4" />
                <div class="zhang_captcha_box" id="zhang_login_captcha_box" title="点击刷新验证码"></div>
              </div>
              <p class="zhang_form_tip" id="zhang_login_captcha_tip"></p>
            </div>
            <button class="zhang_btn" type="submit" id="zhang_login_submit">登 录</button>
          </form>
          <p class="zhang_auth_link">还没有账号？<a href="./register.html">立即注册</a></p>
        </div>

        <!-- 已登录：当前用户信息 -->
        <div id="zhang_user_area" hidden>
          <div class="zhang_user_head">
            <span class="zhang_user_avatar" id="zhang_user_avatar">田</span>
            <div>
              <div class="zhang_user_name" id="zhang_user_name">-</div>
              <div class="zhang_user_desc" id="zhang_user_desc">-</div>
            </div>
          </div>
          <div class="zhang_user_rows">
            <div class="zhang_db_info_row">
              <span class="zhang_db_info_label">用户 ID</span>
              <span id="zhang_user_id">-</span>
            </div>
            <div class="zhang_db_info_row">
              <span class="zhang_db_info_label">昵称</span>
              <span id="zhang_user_nickname">-</span>
            </div>
            <div class="zhang_db_info_row">
              <span class="zhang_db_info_label">邮箱</span>
              <span id="zhang_user_email">-</span>
            </div>
            <div class="zhang_db_info_row">
              <span class="zhang_db_info_label">注册时间</span>
              <span id="zhang_user_create">-</span>
            </div>
            <div class="zhang_db_info_row">
              <span class="zhang_db_info_label">最近登录</span>
              <span id="zhang_user_last_login">-</span>
            </div>
            <div class="zhang_db_info_row">
              <span class="zhang_db_info_label">登录状态</span>
              <span class="zhang_user_online">已登录 · 令牌有效</span>
            </div>
          </div>
          <div class="zhang_user_actions">
            <a class="zhang_btn zhang_btn_ghost zhang_auth_btn_link" href="./index.html">返回首页</a>
            <button class="zhang_btn zhang_btn_ghost" type="button" id="zhang_logout_btn">退出登录</button>
          </div>
        </div>

        <div class="zhang_alert" id="zhang_login_alert" hidden>
          <span class="zhang_alert_icon"></span>
          <span class="zhang_alert_text"></span>
        </div>
      </div>
    </section>
  </main>

  <footer class="zhang_footer">
    <p>张婧雅　24005240115　田园优选 · 农产品销售网站</p>
  </footer>

  <script src="./js/zhang_canvas.js"></script>
  <script src="./js/zhang_auth.js"></script>
  <script src="./js/login.js"></script>
</body>
</html>
