<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用户注册 · 田园优选 | 张婧雅 24005240115</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <canvas class="zhang_canvas_bg" id="zhang_canvas_bg"></canvas>

  <header class="zhang_top">
    <div class="zhang_top_inner">
      <div class="zhang_brand">
        <span class="zhang_brand_mark">田</span>
        <div class="zhang_brand_text">
          <div class="zhang_brand_name">田园优选</div>
          <div class="zhang_brand_desc">用户注册</div>
        </div>
      </div>
      <nav class="zhang_top_nav">
        <a href="./index.html">返回首页</a>
        <a href="./login.html">已有账号登录</a>
      </nav>
    </div>
  </header>

  <main class="zhang_wrap zhang_wrap_auth">
    <section class="zhang_section">
      <h2 class="zhang_section_title">用户注册</h2>
      <div class="zhang_panel zhang_auth_panel">
        <p class="zhang_auth_sub">密码经 scrypt 加盐哈希后存储，数据库中不保存明文；注册需填写图形验证码。</p>
        <form class="zhang_form" id="zhang_register_form" novalidate>
          <div class="zhang_form_item">
            <label class="zhang_form_label" for="zhang_register_username">用户名</label>
            <input class="zhang_input" id="zhang_register_username" type="text" placeholder="字母开头，4-20 位字母 / 数字 / 下划线" autocomplete="username" maxlength="20" />
            <p class="zhang_form_tip" id="zhang_register_username_tip"></p>
          </div>
          <div class="zhang_form_item">
            <label class="zhang_form_label" for="zhang_register_nickname">昵称</label>
            <input class="zhang_input" id="zhang_register_nickname" type="text" placeholder="2-20 个字符" maxlength="20" />
            <p class="zhang_form_tip" id="zhang_register_nickname_tip"></p>
          </div>
          <div class="zhang_form_item">
            <label class="zhang_form_label" for="zhang_register_email">邮箱（选填）</label>
            <input class="zhang_input" id="zhang_register_email" type="email" placeholder="例如 farmer01@zhangfarm.cn" autocomplete="email" maxlength="100" />
            <p class="zhang_form_tip" id="zhang_register_email_tip"></p>
          </div>
          <div class="zhang_form_item">
            <label class="zhang_form_label" for="zhang_register_password">密码</label>
            <input class="zhang_input" id="zhang_register_password" type="password" placeholder="8-20 位，需同时包含字母和数字" autocomplete="new-password" maxlength="20" />
            <p class="zhang_form_tip" id="zhang_register_password_tip"></p>
          </div>
          <div class="zhang_form_item">
            <label class="zhang_form_label" for="zhang_register_password2">确认密码</label>
            <input class="zhang_input" id="zhang_register_password2" type="password" placeholder="请再次输入密码" autocomplete="new-password" maxlength="20" />
            <p class="zhang_form_tip" id="zhang_register_password2_tip"></p>
          </div>
          <div class="zhang_form_item">
            <label class="zhang_form_label" for="zhang_register_captcha">图形验证码</label>
            <div class="zhang_captcha_row">
              <input class="zhang_input" id="zhang_register_captcha" type="text" placeholder="4 位验证码" autocomplete="off" maxlength="4" />
              <div class="zhang_captcha_box" id="zhang_register_captcha_box" title="点击刷新验证码"></div>
            </div>
            <p class="zhang_form_tip" id="zhang_register_captcha_tip"></p>
          </div>
          <button class="zhang_btn" type="submit" id="zhang_register_submit">注 册</button>
        </form>

        <div class="zhang_alert" id="zhang_register_alert" hidden>
          <span class="zhang_alert_icon"></span>
          <span class="zhang_alert_text"></span>
        </div>

        <p class="zhang_auth_link">已有账号？<a href="./login.html">前往登录</a></p>
      </div>
    </section>
  </main>

  <footer class="zhang_footer">
    <p>张婧雅　24005240115　田园优选 · 农产品销售网站</p>
  </footer>

  <script src="./js/zhang_canvas.js"></script>
  <script src="./js/zhang_auth.js"></script>
  <script src="./js/register.js"></script>
</body>
</html>
