<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>科技新闻列表 · 田园优选 | 张婧雅 24005240115</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <canvas class="zhang_canvas_bg" id="zhang_canvas_bg"></canvas>

  <header class="zhang_top">
    <div class="zhang_top_inner">
      <div class="zhang_brand">
        <span class="zhang_brand_mark">田</span>
        <div class="zhang_brand_text">
          <div class="zhang_brand_name">田园优选</div>
          <div class="zhang_brand_desc">科技新闻列表</div>
        </div>
      </div>
      <nav class="zhang_top_nav">
        <a href="./index.html">返回首页</a>
        <a href="#zhang_api">接口信息</a>
        <a href="#zhang_news_list">新闻列表</a>
        <a href="./login.html">登录</a>
        <a href="./register.html">注册</a>
      </nav>
    </div>
  </header>

  <main class="zhang_wrap">
    <!-- 接口信息 -->
    <section class="zhang_section" id="zhang_api">
      <h2 class="zhang_section_title">后端接口</h2>
      <div class="zhang_api_box">
        <div class="zhang_api_row">
          <span class="zhang_api_method">GET</span>
          <a class="zhang_api_url" id="zhang_api_url" href="/api/news" target="_blank" rel="noopener">http://localhost:8115/api/news</a>
        </div>
        <p class="zhang_api_desc">请求参数：<code>page</code>（页码，默认 1）、<code>pageSize</code>（每页条数，默认 10，最大 50）、<code>keyword</code>（关键词，可空）。数据来源：MySQL 表 <code>zhang_news</code>。</p>
      </div>
    </section>

    <!-- 新闻列表 -->
    <section class="zhang_section" id="zhang_news_list">
      <h2 class="zhang_section_title">新闻列表 <span class="zhang_count" id="zhang_news_count">加载中…</span></h2>

      <div class="zhang_toolbar">
        <input class="zhang_input zhang_input_inline" id="zhang_keyword" type="text" placeholder="输入关键词搜索标题 / 摘要 / 分类" />
        <button class="zhang_btn zhang_btn_inline" id="zhang_search_btn" type="button">搜索</button>
        <button class="zhang_btn zhang_btn_inline zhang_btn_ghost" id="zhang_reset_btn" type="button">重置</button>
      </div>

      <div class="zhang_alert zhang_alert_err" id="zhang_news_alert" hidden>
        <span class="zhang_alert_icon">✗</span>
        <span class="zhang_alert_text" id="zhang_news_alert_text"></span>
      </div>

      <div class="zhang_news_list" id="zhang_news_list_box"></div>

      <div class="zhang_pager" id="zhang_pager" hidden>
        <button class="zhang_btn zhang_btn_inline zhang_btn_ghost" id="zhang_prev_btn" type="button">上一页</button>
        <span class="zhang_pager_text" id="zhang_pager_text">第 1 / 1 页</span>
        <button class="zhang_btn zhang_btn_inline zhang_btn_ghost" id="zhang_next_btn" type="button">下一页</button>
      </div>

      <details class="zhang_raw">
        <summary>查看接口返回的原始 JSON 数据</summary>
        <pre class="zhang_raw_code" id="zhang_raw_json">加载中…</pre>
      </details>
    </section>
  </main>

  <footer class="zhang_footer">
    <p>张婧雅　24005240115　田园优选 · 农产品销售网站</p>
  </footer>

  <script src="./js/zhang_canvas.js"></script>
  <script src="./js/news.js"></script>
</body>
</html>
