# 说明：将纯静态部署目录 deploy/ 发布到 GitHub Pages（仅首页、简历与接口说明文档，不含后台接口页面）
name: zhang-pages

on:
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - '.github/workflows/zhang_pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: zhang-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: 上传静态目录
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy
      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
